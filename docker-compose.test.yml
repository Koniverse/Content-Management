version: "3.8"

services:
  strapi:
    image: content-management:test
    env_file:
      - .env.test
    command: yarn start
    depends_on:
      - postgres
    ports:
      - "8137:1337"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5632:5432"

volumes:
  pgdata:
